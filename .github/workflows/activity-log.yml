name: Update public GitHub activity log

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-public-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Record newly observed public events
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'ACTIVITY.md';
            const username = 'kayz41';
            const apiUrl = `https://api.github.com/users/${username}/events/public?per_page=100`;

            const response = await fetch(apiUrl, {
              headers: {
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'profile-activity-recorder'
              }
            });

            if (!response.ok) {
              throw new Error(`GitHub public events API returned ${response.status}`);
            }

            const events = await response.json();
            const previous = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '# Public GitHub Activity Log\n';
            const knownIds = new Set([...previous.matchAll(/<!-- event:([0-9]+) -->/g)].map(match => match[1]));

            const labels = {
              PushEvent: 'Pushed commits',
              CreateEvent: 'Created a repository, branch or tag',
              PullRequestEvent: 'Opened or updated a pull request',
              IssuesEvent: 'Worked with an issue',
              IssueCommentEvent: 'Commented on an issue',
              WatchEvent: 'Starred a repository',
              ForkEvent: 'Forked a repository',
              ReleaseEvent: 'Published a release',
              PublicEvent: 'Made a repository public'
            };

            const fresh = events
              .filter(event => !knownIds.has(String(event.id)))
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            if (fresh.length === 0) {
              core.info('No new public GitHub events to record.');
              return;
            }

            const sections = fresh.map(event => {
              const label = labels[event.type] || event.type;
              const repo = event.repo?.name || 'Unknown repository';
              const date = new Date(event.created_at).toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC');
              return `<!-- event:${event.id} -->\n- **${date}** — ${label} in [${repo}](https://github.com/${repo})`;
            });

            const heading = `\n\n## Activity recorded — ${new Date().toISOString().slice(0, 10)}\n\n`;
            fs.appendFileSync(path, heading + sections.join('\n') + '\n');
            core.info(`Recorded ${fresh.length} new public events.`);

      - name: Commit activity log
        run: |
          if [[ -n "$(git status --porcelain ACTIVITY.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ACTIVITY.md
            git commit -m "chore: record public GitHub activity"
            git push
          else
            echo "Activity log is already up to date."
          fi
